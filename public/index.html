
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #eef2ff;
      color: #1e293b;
    }

    .card {
      max-width: 460px;
      margin: 20px auto;
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 8px 28px #00000012;
    }

    h1 { text-align: center; color: #3730a3; }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
      background: white;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 24px;
      border: none;
      border-radius: 7px;
      background: #4338ca;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover { background: #3730a3; }
    .note { text-align: center; font-size: 13px; color: #64748b; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Student Registration</h1>
    <p class="subtitle">Server-Side Validation Using ExpressJS</p>

    <form action="/register" method="POST" novalidate>
      <label for="name">Student Name</label>
      <input id="name" name="name" type="text"
             placeholder="Enter your full name">

      <label for="email">Email Address</label>
      <input id="email" name="email" type="text"
             placeholder="Enter your email">

      <label for="age">Age</label>
      <input id="age" name="age" type="number"
             placeholder="Enter your age">

      <label for="course">Select Course</label>
      <select id="course" name="course">
        <option value="">-- Select a course --</option>
        <option value="BCA">BCA</option>
        <option value="BSc IT">BSc IT</option>
        <option value="BTech">BTech</option>
        <option value="MCA">MCA</option>
      </select>

      <button type="submit">Register Student</button>
    </form>

    <p class="note">All information is checked by the server.</p>
  </div>
</body>
</html>
